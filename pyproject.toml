[project]
name = "nq-strategy-research"
version = "0.1.0"
description = "Reproducible NQ futures strategy research framework (Phase 1: Fast-Slow)"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pyarrow>=16",
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nqr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
